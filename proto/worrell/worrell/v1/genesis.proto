syntax = "proto3";
package worrell.worrell.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "worrell/worrell/v1/params.proto";

option go_package = "github.com/worrellchain/worrell/x/worrell/types";

// GenesisState defines the worrell module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
