syntax = "proto3";
package worrell.worrell.module.v1;

import "cosmos/app/v1alpha1/module.proto";

option go_package = "github.com/worrellchain/worrell/x/worrell/types";

// Module is the config object for the module.
message Module {
  option (cosmos.app.v1alpha1.module) = {go_import: "github.com/worrellchain/worrell/x/worrell"};

  // authority defines the custom module authority.
  // If not set, defaults to the governance module.
  string authority = 1;
}
