# Builds and publishes worrelld release binaries.
#
# Triggered ONLY when a version tag is pushed (e.g. v0.1.0):
#
#   git tag v0.1.0
#   git push --tags
#
# It compiles the node with a pinned Go toolchain for linux/amd64, linux/arm64,
# darwin/amd64 and darwin/arm64 and attaches the tarballs to a GitHub (pre)release
# for that tag. Review the generated release page and publish it when ready.
#
# All four binaries are statically linked (CGO disabled) and report the same
# application name (`worrell`) and version (the tag, e.g. `v0.2.0`) as a binary
# built with `make install`, so both installation paths behave identically.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned on purpose: every release is built with the same compiler.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"

      - name: Build release binaries
        env:
          GOFLAGS: "-buildvcs=false"
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # The version is the tag itself (with the leading "v"), as `make install` reports it.
          version="${tag}"
          commit="$(git rev-parse HEAD)"
          # Same application name as the Makefile (APPNAME). It is also the keyring service
          # name for the `os` and `pass` backends, so it must not differ between builds.
          ldflags="-X github.com/cosmos/cosmos-sdk/version.Name=worrell"
          ldflags="$ldflags -X github.com/cosmos/cosmos-sdk/version.AppName=worrelld"
          ldflags="$ldflags -X github.com/cosmos/cosmos-sdk/version.Version=${version}"
          ldflags="$ldflags -X github.com/cosmos/cosmos-sdk/version.Commit=${commit}"
          mkdir -p release
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            # Every target is statically linked: no glibc (or any other library) requirement.
            out="$(mktemp -d)"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -mod=readonly -ldflags "$ldflags" -o "$out/worrelld" ./cmd/worrelld
            tar -czf "release/${tag}_${os}_${arch}.tar.gz" -C "$out" worrelld
            rm -rf "$out"
          done
          cd release
          sha256sum *.tar.gz > release_checksum
          cat release_checksum

      - name: Publish the Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
