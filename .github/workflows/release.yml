# Builds and publishes worrelld release binaries.
#
# Triggered ONLY when a version tag is pushed (e.g. v0.1.0):
#
#   git tag v0.1.0
#   git push --tags
#
# It cross-compiles the node for linux/amd64, linux/arm64, darwin/amd64 and
# darwin/arm64 and attaches the tarballs to a GitHub (pre)release for that tag.
# Review the generated release page and publish it when ready.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Release Variables
        id: vars
        uses: ignite/cli/actions/release/vars@main

      - name: Issue Release Assets
        uses: ignite/cli/actions/cli@main
        if: ${{ steps.vars.outputs.should_release == 'true' }}
        with:
          args: chain build --release --release.prefix ${{ steps.vars.outputs.tarball_prefix }} -t linux:amd64 -t linux:arm64 -t darwin:amd64 -t darwin:arm64 -y
        env:
          DO_NOT_TRACK: 1
          GOFLAGS: "-buildvcs=false"

      # Ignite's release tarballs bury the binary under an internal tmp/ path.
      # Repackage each one so `tar -xzf` yields `worrelld` at the top level,
      # then regenerate the checksum file for the new tarballs.
      - name: Repackage tarballs with a clean layout
        if: ${{ steps.vars.outputs.should_release == 'true' }}
        run: |
          set -euo pipefail
          cd release
          for f in *.tar.gz; do
            dir=$(mktemp -d)
            tar -xzf "$f" -C "$dir"
            bin=$(find "$dir" -type f -name worrelld | head -1)
            chmod +x "$bin"
            tar -czf "$f.new" -C "$(dirname "$bin")" worrelld
            mv "$f.new" "$f"
            rm -rf "$dir"
          done
          sha256sum *.tar.gz > release_checksum
          echo "--- clean layout check ---"
          for f in *.tar.gz; do echo "$f:"; tar -tzf "$f"; done
          cat release_checksum

      - name: Publish the Release
        uses: softprops/action-gh-release@v1
        if: ${{ steps.vars.outputs.should_release == 'true' }}
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          files: release/*
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
