# Builds and publishes worrelld release binaries.
#
# Triggered ONLY when a version tag is pushed (e.g. v0.1.0):
#
#   git tag v0.1.0
#   git push --tags
#
# It compiles the node with a pinned Go toolchain for linux/amd64, linux/arm64,
# darwin/amd64 and darwin/arm64 and attaches the tarballs to a GitHub (pre)release
# for that tag. Review the generated release page and publish it when ready.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    # ubuntu-22.04 keeps the glibc requirement of the linux/amd64 binary at 2.34
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned on purpose: every release is built with the same compiler.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Build release binaries
        env:
          GOFLAGS: "-buildvcs=false"
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          commit="$(git rev-parse HEAD)"
          ldflags="-X github.com/cosmos/cosmos-sdk/version.Name=Worrell"
          ldflags="$ldflags -X github.com/cosmos/cosmos-sdk/version.AppName=worrelld"
          ldflags="$ldflags -X github.com/cosmos/cosmos-sdk/version.Version=${version}"
          ldflags="$ldflags -X github.com/cosmos/cosmos-sdk/version.Commit=${commit}"
          mkdir -p release
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            # linux/amd64 is built natively and links against glibc; the other targets are static
            cgo=0
            [ "$target" = "linux/amd64" ] && cgo=1
            out="$(mktemp -d)"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED="$cgo" \
              go build -mod=readonly -ldflags "$ldflags" -o "$out/worrelld" ./cmd/worrelld
            tar -czf "release/${tag}_${os}_${arch}.tar.gz" -C "$out" worrelld
            rm -rf "$out"
          done
          cd release
          sha256sum *.tar.gz > release_checksum
          cat release_checksum

      - name: Publish the Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
